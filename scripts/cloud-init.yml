#cloud-config

# Simple and reliable Django setup following successful test pattern
runcmd:
  # Create a test file to prove cloud-init ran
  - echo "Django cloud-init started at $(date)" > /home/ubuntu/django-init.log
  - chown ubuntu:ubuntu /home/ubuntu/django-init.log
  
  # Update packages (like successful test)
  - apt-get update
  
  # Install Docker prerequisites
  - apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
  
  # Install Docker (following test pattern - simple and direct)
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  
  # Configure Docker (like successful test)
  - usermod -aG docker ubuntu
  - systemctl enable docker
  - systemctl start docker
  
  # Create Django app directory
  - mkdir -p /home/ubuntu/django-app
  - chown ubuntu:ubuntu /home/ubuntu/django-app
  
  # Create Django application files
  - |
    cat > /home/ubuntu/django-app/requirements.txt << 'EOF'
    Django==4.2.7
    gunicorn==21.2.0
    EOF
  
  - |
    cat > /home/ubuntu/django-app/Dockerfile << 'EOF'
    FROM python:3.11-slim
    
    WORKDIR /app
    
    # Install system dependencies
    RUN apt-get update && apt-get install -y \
        gcc \
        && rm -rf /var/lib/apt/lists/*
    
    # Install Python dependencies
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    
    # Create Django project
    RUN django-admin startproject helloworld .
    
    # Copy custom settings
    COPY settings.py helloworld/settings.py
    COPY urls.py helloworld/urls.py
    COPY views.py helloworld/views.py
    
    # Collect static files
    RUN python manage.py collectstatic --noinput
    
    EXPOSE 8000
    
    CMD ["gunicorn", "--bind", "0.0.0.0:8000", "helloworld.wsgi:application"]
    EOF
  
  - |
    cat > /home/ubuntu/django-app/settings.py << 'EOF'
    from pathlib import Path
    import os
    
    BASE_DIR = Path(__file__).resolve().parent.parent
    
    SECRET_KEY = 'django-insecure-demo-key-change-in-production'
    
    DEBUG = True
    
    ALLOWED_HOSTS = ['*']
    
    INSTALLED_APPS = [
        'django.contrib.admin',
        'django.contrib.auth',
        'django.contrib.contenttypes',
        'django.contrib.sessions',
        'django.contrib.messages',
        'django.contrib.staticfiles',
    ]
    
    MIDDLEWARE = [
        'django.middleware.security.SecurityMiddleware',
        'django.contrib.sessions.middleware.SessionMiddleware',
        'django.middleware.common.CommonMiddleware',
        'django.middleware.csrf.CsrfViewMiddleware',
        'django.contrib.auth.middleware.AuthenticationMiddleware',
        'django.contrib.messages.middleware.MessageMiddleware',
        'django.middleware.clickjacking.XFrameOptionsMiddleware',
    ]
    
    ROOT_URLCONF = 'helloworld.urls'
    
    TEMPLATES = [
        {
            'BACKEND': 'django.template.backends.django.DjangoTemplates',
            'DIRS': [],
            'APP_DIRS': True,
            'OPTIONS': {
                'context_processors': [
                    'django.template.context_processors.debug',
                    'django.template.context_processors.request',
                    'django.contrib.auth.context_processors.auth',
                    'django.contrib.messages.context_processors.messages',
                ],
            },
        },
    ]
    
    WSGI_APPLICATION = 'helloworld.wsgi.application'
    
    DATABASES = {
        'default': {
            'ENGINE': 'django.db.backends.sqlite3',
            'NAME': BASE_DIR / 'db.sqlite3',
        }
    }
    
    AUTH_PASSWORD_VALIDATORS = [
        {
            'NAME': 'django.contrib.auth.password_validation.UserAttributeSimilarityValidator',
        },
        {
            'NAME': 'django.contrib.auth.password_validation.MinimumLengthValidator',
        },
        {
            'NAME': 'django.contrib.auth.password_validation.CommonPasswordValidator',
        },
        {
            'NAME': 'django.contrib.auth.password_validation.NumericPasswordValidator',
        },
    ]
    
    LANGUAGE_CODE = 'en-us'
    TIME_ZONE = 'UTC'
    USE_I18N = True
    USE_TZ = True
    
    STATIC_URL = '/static/'
    STATIC_ROOT = os.path.join(BASE_DIR, 'staticfiles')
    
    DEFAULT_AUTO_FIELD = 'django.db.models.BigAutoField'
    EOF
  
  - |
    cat > /home/ubuntu/django-app/urls.py << 'EOF'
    from django.contrib import admin
    from django.urls import path
    from . import views
    
    urlpatterns = [
        path('admin/', admin.site.urls),
        path('', views.hello_world, name='hello_world'),
    ]
    EOF
  
  - |
    cat > /home/ubuntu/django-app/views.py << 'EOF'
    from django.http import HttpResponse
    import datetime
    
    def hello_world(request):
        html = """
        <!DOCTYPE html>
        <html>
        <head>
            <title>Hello World Django App</title>
            <style>
                body {
                    font-family: Arial, sans-serif;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    margin: 0; padding: 0; display: flex;
                    justify-content: center; align-items: center;
                    min-height: 100vh;
                }
                .container {
                    background: white; padding: 40px;
                    border-radius: 10px;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                    text-align: center; max-width: 500px;
                }
                h1 { color: #333; font-size: 2.5em; margin-bottom: 20px; }
                p { color: #666; font-size: 1.2em; margin: 10px 0; }
                .info { background: #f8f9fa; padding: 20px; border-radius: 5px; margin-top: 20px; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>🎉 Hello World! 🎉</h1>
                <p>Welcome to your Django app running on Docker in Azure!</p>
                <div class="info">
                    <p><strong>Server Time:</strong> {}</p>
                    <p><strong>Status:</strong> Running successfully</p>
                    <p><strong>Framework:</strong> Django + Docker</p>
                    <p><strong>Cloud:</strong> Microsoft Azure</p>
                </div>
            </div>
        </body>
        </html>
        """.format(datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S UTC"))
        
        return HttpResponse(html)
    EOF
  
  - |
    cat > /home/ubuntu/django-app/docker-compose.yml << 'EOF'
    version: '3.8'
    services:
      web:
        build: .
        ports:
          - "80:8000"
        restart: unless-stopped
        environment:
          - DJANGO_SETTINGS_MODULE=helloworld.settings
    EOF
  
  # Set proper ownership
  - chown -R ubuntu:ubuntu /home/ubuntu/django-app
  
  # Build and start Django app (following successful test approach)
  - echo "Building Django app at $(date)" >> /home/ubuntu/django-init.log
  - cd /home/ubuntu/django-app && docker compose build
  - echo "Starting Django app at $(date)" >> /home/ubuntu/django-init.log
  - cd /home/ubuntu/django-app && docker compose up -d
  
  # Log completion
  - echo "Django app setup completed successfully at $(date)" >> /home/ubuntu/django-init.log
  
  # Create management script
  - |
    cat > /home/ubuntu/manage-app.sh << 'EOF'
    #!/bin/bash
    cd /home/ubuntu/django-app
    
    case "$1" in
        start)
            docker compose up -d
            echo "Django app started"
            ;;
        stop)
            docker compose down
            echo "Django app stopped"
            ;;
        restart)
            docker compose down
            docker compose up -d
            echo "Django app restarted"
            ;;
        logs)
            docker compose logs -f
            ;;
        status)
            docker compose ps
            ;;
        *)
            echo "Usage: $0 {start|stop|restart|logs|status}"
            exit 1
            ;;
    esac
    EOF
  
  - chmod +x /home/ubuntu/manage-app.sh
  - chown ubuntu:ubuntu /home/ubuntu/manage-app.sh

write_files:
  - path: /home/ubuntu/django-info.txt
    content: |
      Django Hello World App Information
      ==================================
      
      This file was created by cloud-init to verify Django deployment.
      
      Files created:
      - /home/ubuntu/django-init.log (setup progress log)
      - /home/ubuntu/django-info.txt (this file)
      - /home/ubuntu/django-app/ (application directory)
      - /home/ubuntu/manage-app.sh (management script)
      
      Services:
      - Docker containers running Django on port 80
      
      Verification:
      1. SSH: Check logs with: cat /home/ubuntu/django-init.log
      2. Web: Visit http://VM_PUBLIC_IP (Django hello world)
      3. Management: Use /home/ubuntu/manage-app.sh {start|stop|restart|logs|status}
      4. Logs: Check /var/log/cloud-init-output.log
    owner: ubuntu:ubuntu
    permissions: '0644'
    
  - path: /etc/systemd/system/django-app.service
    content: |
      [Unit]
      Description=Django Hello World App
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/home/ubuntu/django-app
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      User=ubuntu
      Group=ubuntu

      [Install]
      WantedBy=multi-user.target
    owner: root:root
    permissions: '0644'

final_message: |
  Django Hello World app setup completed successfully!
  
  Verification steps:
  1. Check setup log: cat /home/ubuntu/django-init.log
  2. Visit Django app: http://VM_PUBLIC_IP
  3. Check app status: /home/ubuntu/manage-app.sh status
  4. View cloud-init logs: sudo cat /var/log/cloud-init-output.log
  
  Management commands:
  - /home/ubuntu/manage-app.sh {start|stop|restart|logs|status}
  - sudo systemctl {start|stop|status} django-app